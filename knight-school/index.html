<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Knight School">
<meta name="theme-color" content="#1c2541">
<meta name="description" content="Chess puzzles, lessons and a coach to play against. Works offline, no accounts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Knight School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Layout: a classroom bench. Board on the left, Coach's notebook on the right; stacks on phones. */
:root {
  --bg: #eef2f7; --surface: #ffffff; --surface-2: #e3e9f2; --ink: #1c2541; --muted: #5b6684;
  --accent: #f0a202; --accent-ink: #3a2700; --good: #23856a; --bad: #c9473f; --line: #cfd8e6;
  --sq-l: #ecd9b4; --sq-d: #a9744d; --sq-last: rgba(240, 162, 2, .45); --sq-sel: rgba(35, 133, 106, .55);
  --piece-dark: #1b1b22; --piece-light: #fbfaf6;
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --glyph: 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'DejaVu Sans', serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121829; --surface: #1b2340; --surface-2: #26305a; --ink: #e9edf8; --muted: #a3acc8;
  --accent: #f5b62f; --accent-ink: #2c1e00; --good: #49c29b; --bad: #ef7268; --line: #323d68;
  --sq-l: #d9c39b; --sq-d: #8e5f3e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121829; --surface: #1b2340; --surface-2: #26305a; --ink: #e9edf8; --muted: #a3acc8;
  --accent: #f5b62f; --accent-ink: #2c1e00; --good: #49c29b; --bad: #ef7268; --line: #323d68;
  --sq-l: #d9c39b; --sq-d: #8e5f3e; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 6px 14px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand .mark { width: 44px; height: 44px; border-radius: 12px; background: var(--ink); color: var(--accent); display: grid; place-items: center; font: 30px/1 var(--glyph); }
.brand h1 { font-size: 26px; }
.brand small { display: block; color: var(--muted); font-size: 13px; font-family: var(--body); }
.who { display: flex; gap: 8px; align-items: center; }
.who select { font: 600 15px var(--body); padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.iconbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.stars { font-family: var(--display); font-weight: 600; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; white-space: nowrap; }
.stars span { color: var(--accent); }

nav.tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 2px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 10px 16px; font: 600 17px var(--display); color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -2px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* shelf */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.book { display: flex; flex-direction: column; text-align: left; border: 0; padding: 0; background: none; }
.cover { aspect-ratio: 3 / 4; max-width: 100%; border-radius: 6px 14px 14px 6px; padding: 18px 16px 16px 26px; display: flex; flex-direction: column; justify-content: space-between; position: relative; color: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.18); transition: transform .15s; }
.book:hover .cover { transform: translateY(-3px); }
.cover::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 6px; background: rgba(255,255,255,.25); border-radius: 3px; }
.cover h3 { font-size: 22px; }
.cover .by { font-size: 14px; opacity: .85; }
.cover .glyph { font: 74px/1 var(--glyph); opacity: .9; align-self: flex-end; }
.meter { height: 8px; background: rgba(255,255,255,.3); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.book .cap { margin-top: 10px; font-weight: 700; }
.book .cap small { display: block; color: var(--muted); font-weight: 600; }
.addbook { border: 2px dashed var(--line); border-radius: 14px; padding: 18px; color: var(--muted); display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.addbook strong { color: var(--ink); font-family: var(--display); font-size: 18px; font-weight: 600; }

.bookhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.bookhead h2 { font-size: 26px; margin-right: auto; }
.back { border: 0; background: none; color: var(--muted); font-weight: 700; padding: 4px 0; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.tile { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; font: 600 20px var(--display); font-variant-numeric: tabular-nums; }
.tile small { font: 12px/1 var(--body); color: var(--accent); letter-spacing: 1px; min-height: 12px; }
.tile.done { background: var(--surface-2); }

/* trainer */
.bench { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: 22px; align-items: start; }
@media (max-width: 820px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.boardbox { width: 100%; max-width: min(640px, 100%); margin-inline: auto; }
.board { position: relative; width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 6px var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; }
.squares { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
.sq { position: relative; display: grid; place-items: center; container-type: size; }
.sq.l { background: var(--sq-l); } .sq.d { background: var(--sq-d); }
.sq.last::after { content: ""; position: absolute; inset: 0; background: var(--sq-last); }
.sq.sel::after { content: ""; position: absolute; inset: 0; background: var(--sq-sel); }
.sq.check { background: radial-gradient(circle, #ff5a4a 0%, #e0302a 45%, transparent 75%), var(--sq-d); }
.sq.dot::before { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(28, 37, 65, .35); z-index: 2; }
.sq.cap::before { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 5px solid rgba(28, 37, 65, .35); z-index: 2; }
.sq.ring-danger::before { content: ""; position: absolute; inset: 5%; border-radius: 50%; border: 4px solid var(--bad); z-index: 2; box-shadow: 0 0 10px var(--bad); }
.sq.ring-hint::before { content: ""; position: absolute; inset: 5%; border-radius: 50%; border: 5px solid var(--good); z-index: 2; animation: pulse 1.1s ease-in-out infinite; }
.sq.ring-pick::before { content: ""; position: absolute; inset: 12%; border-radius: 50%; background: rgba(35, 133, 106, .55); border: 3px solid var(--good); z-index: 2; }
.sq.ring-ok::before { content: "\2713"; position: absolute; inset: 12%; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; font: 800 22px var(--body); z-index: 5; }
.sq.ring-miss::before { content: "?"; position: absolute; inset: 12%; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 22px var(--body); z-index: 5; }
.sq.ring-wrong::before { content: "\2715"; position: absolute; inset: 12%; border-radius: 50%; background: var(--bad); color: #fff; display: grid; place-items: center; font: 800 22px var(--body); z-index: 5; }
@keyframes pulse { 50% { transform: scale(.88); } }
.cr, .cf { position: absolute; font: 700 11px var(--body); z-index: 1; opacity: .8; }
.cr { left: 4px; top: 2px; } .cf { right: 4px; bottom: 1px; }
.sq.l .cr, .sq.l .cf { color: var(--sq-d); } .sq.d .cr, .sq.d .cf { color: var(--sq-l); }
.pc { position: relative; z-index: 3; width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--glyph); cursor: grab; }
.pc i, .pc b { grid-area: 1 / 1; font-style: normal; font-weight: 400; font-size: 78cqh; line-height: 1; }
.pc.b i { color: var(--piece-dark); text-shadow: 0 1px 0 rgba(255,255,255,.25); }
.pc.w i { color: var(--piece-light); }
.pc.w b { color: var(--piece-dark); }
.pc.ghost { position: fixed; z-index: 99; pointer-events: none; container-type: size; }
.pc.ghost i, .pc.ghost b { font-size: 85cqh; }
svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
.arw { stroke: rgba(35, 133, 106, .85); stroke-width: 18; stroke-linecap: round; }
.arw.bad { stroke: rgba(201, 71, 63, .85); }

.panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ptitle { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ptitle h2 { font-size: 24px; }
.turn { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.turn i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
.turn.w i { background: #fff; } .turn.b i { background: #111; }
.coach { display: flex; gap: 12px; align-items: flex-start; }
.coach .face { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 34px/1 var(--glyph); }
.bubble { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; flex: 1; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 18px; width: 14px; height: 14px; background: var(--surface); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.bubble p { margin: 0 0 6px; } .bubble p:last-child { margin-bottom: 0; }
.bubble.good { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.bubble.bad { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.tag { display: inline-block; font: 700 12px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent); padding: 2px 8px; border-radius: 6px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 800; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.go { background: var(--good); color: #fff; border-color: var(--good); }
.btn:disabled { opacity: .45; cursor: default; }
.moves { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; font-variant-numeric: tabular-nums; max-height: 160px; overflow: auto; font-size: 15px; }
.moves:empty::before { content: "Moves will show up here."; color: var(--muted); }
.note { color: var(--muted); font-size: 14px; }

/* play setup */
.setup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.setup h3 { font-size: 18px; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lvl { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 6px; text-align: center; }
.lvl b { display: block; font: 34px/1.1 var(--glyph); font-weight: 400; }
.lvl span { font-weight: 800; font-size: 14px; }
.lvl[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.toggle input { width: 20px; height: 20px; accent-color: var(--good); }

/* lessons */
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.lesson { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.lesson .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font: 600 16px var(--display); }
.lesson.done .num { background: var(--good); color: #fff; }
.lesson strong { font-family: var(--display); font-weight: 600; font-size: 17px; }
.lessontext p { margin: 0 0 10px; max-width: 62ch; }

.volhead { font-size: 19px; margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
.sessions { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.session { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.session .num { flex: none; min-width: 38px; height: 38px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font: 600 16px var(--display); font-variant-numeric: tabular-nums; }
.session.done .num { background: var(--good); color: #fff; }
.session strong { font-family: var(--display); font-weight: 600; font-size: 16px; }
.backup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
.backup h3 { font-size: 17px; }
.backup textarea { width: 100%; font: 13px/1.4 ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--bg); color: var(--ink); resize: vertical; }
.kids { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kids input { font: 600 15px var(--body); padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 150px; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 100; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .sq.ring-hint::before { animation: none; } .book:hover .cover { transform: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true">&#9822;</div><div><h1>Knight School</h1><small>Chess puzzles and lessons from your own books</small></div></div>
    <div class="stars" title="Stars earned"><span>&#9733;</span> <b id="starCount">0</b></div>
    <div class="who">
      <label for="player" class="note">Player</label>
      <select id="player"></select>
      <button class="iconbtn" id="addKidBtn" type="button">+ Add</button>
    </div>
    <button class="iconbtn" id="voiceBtn" type="button" aria-pressed="false" title="Coach reads out loud">Voice off</button>
    <button class="iconbtn" id="backupBtn" type="button" title="Back up or restore progress">Backup</button>
  </header>
  <section class="backup" id="backupPanel" hidden>
    <h3>Back up progress</h3>
    <p class="note">Stars are saved on this device only. Copy this code and keep it somewhere safe (a note or an email to yourself). Paste it on a new device to bring everyone's progress along.</p>
    <textarea id="backupOut" rows="3" readonly></textarea>
    <div class="btns"><button class="btn primary" type="button" id="backupCopy">Copy code</button></div>
    <h3>Restore</h3>
    <textarea id="backupIn" rows="3" placeholder="Paste a Knight School backup code here"></textarea>
    <div class="btns"><button class="btn" type="button" id="backupLoad">Restore progress</button><button class="btn" type="button" id="backupClose">Close</button></div>
    <p class="note" id="backupMsg" role="status"></p>
  </section>
  <form class="kids" id="kidForm" hidden>
    <label for="kidName">Name</label><input id="kidName" maxlength="20" autocomplete="off">
    <button class="btn primary" type="submit">Add player</button>
    <button class="btn" type="button" id="kidCancel">Cancel</button>
  </form>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="books" aria-selected="true">Puzzle books</button>
    <button role="tab" data-tab="play" aria-selected="false">Play the Coach</button>
    <button role="tab" data-tab="lessons" aria-selected="false">Lessons</button>
  </nav>

  <section id="v-books"></section>
  <section id="v-book" hidden></section>
  <section id="v-train" hidden></section>
  <section id="v-play" hidden></section>
  <section id="v-lessons" hidden></section>
  <section id="v-lesson" hidden></section>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="vendor/chess.min.js"></script>
<script>window.Chess || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"><\/script>')</script>
<script src="coach.js"></script>
<script src="board.js"></script>
<script src="lessons.js"></script>
<script>window.BOOKS = [];</script>
<script src="books/winning-chess-strategy-for-kids.js"></script>
<script src="books/the-chess-course.js"></script>
<script src="books/fischer-teaches-chess.js"></script>
<script src="books/traps-and-zaps.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
</body>
</html>
