<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Animal Sounds &amp; Counting</title>
<meta name="theme-color" content="#dff1fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Animal Game">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); height: 100%; background: #dff1fb; }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: one-screen app. Top bar (home / hear again / stars), a stage for the animals, a row of big answer buttons at the bottom. */
:root {
  --sky: #dff1fb;
  --sky-deep: #b9e0f4;
  --grass: #5fae4e;
  --grass-deep: #3f8a33;
  --sun: #ffc93c;
  --ink: #1f3a4d;
  --ink-soft: #4d6878;
  --card: #ffffff;
  --berry: #e8546b;
  --plum: #7a5cc4;
  --ok: #3f9b3a;
  --font-display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-letter: "Andika", "Comic Sans MS", system-ui, sans-serif; /* Andika: letter shapes made for early readers */
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: linear-gradient(var(--sky) 0%, var(--sky) 62%, var(--sky-deep) 100%);
  background-color: var(--sky);
  color: var(--ink);
  font-family: var(--font-display);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.app {
  height: 100%;
  max-width: 820px; margin: 0 auto;
  padding-inline: 16px; padding-block: 10px 14px;
  display: flex; flex-direction: column; gap: 12px;
  box-sizing: border-box;
}
button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--plum); outline-offset: 3px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; min-height: 56px; }
.icon-btn {
  width: 56px; height: 56px; border-radius: 50%;
  border: 0; background: var(--card); box-shadow: 0 3px 0 var(--sky-deep);
  display: grid; place-items: center; flex: none;
}
.icon-btn svg { width: 28px; height: 28px; stroke: var(--ink); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--sky-deep); }
.stars { margin-left: auto; display: flex; gap: 4px; }
.star { width: 30px; height: 30px; }
.star path { fill: #ffffff; stroke: var(--sun); stroke-width: 2; }
.star.on path { fill: var(--sun); }

/* screens */
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }

/* start + menu */
.hello { flex: 1; display: grid; place-items: center; text-align: center; align-content: center; gap: 22px; }
.hello h1 { font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 1.05; margin: 0; text-wrap: balance; font-weight: 700; }
.hello .parade { font-size: clamp(2.4rem, 10vw, 4rem); letter-spacing: .1em; }
.big-go {
  font-size: 2rem; font-weight: 700; padding: 22px 54px; border-radius: 999px; border: 0;
  background: var(--grass); color: #fff; box-shadow: 0 6px 0 var(--grass-deep);
}
.big-go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--grass-deep); }
.loadnote { color: var(--ink-soft); font-size: 1rem; min-height: 1.4em; }

.menu { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-content: center; }
.game-card {
  border: 0; border-radius: 28px; padding: 20px 10px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  color: #fff; font-size: 1.5rem; font-weight: 700;
}
.game-card .face { font-size: 3.4rem; line-height: 1; }
.game-card .glyph { font-family: var(--font-letter); font-size: 3.4rem; line-height: 1; font-weight: 700; }
.game-card.letters { background: var(--plum); box-shadow: 0 6px 0 #5a419d; }
.game-card.count { background: var(--berry); box-shadow: 0 6px 0 #b83a4f; }
.game-card.add { background: var(--grass); box-shadow: 0 6px 0 var(--grass-deep); }
.game-card:active { transform: translateY(4px); box-shadow: none; }
@media (max-width: 560px) {
  .menu { grid-template-columns: 1fr; gap: 12px; }
  .game-card { flex-direction: row; justify-content: center; padding: 14px; gap: 16px; }
  .game-card .face, .game-card .glyph { font-size: 2.6rem; }
}
.grownups { text-align: center; color: var(--ink-soft); font-size: .95rem; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--card); border-radius: 999px; padding: 3px; box-shadow: 0 2px 0 var(--sky-deep); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: .95rem; font-weight: 600; color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

/* play stage */
.stage {
  flex: 1; min-height: 0; background: var(--card); border-radius: 32px;
  box-shadow: 0 6px 0 var(--sky-deep);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 14px; gap: 8px; position: relative; overflow: hidden; text-align: center;
}
.hero-animal { font-size: clamp(6rem, 30vw, 11rem); line-height: 1; }
.hero-name { font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 700; letter-spacing: .02em; }
.hero-name b { color: var(--plum); }
.hero-letter { font-family: var(--font-letter); font-weight: 700; font-size: clamp(7rem, 34vw, 12rem); line-height: 1; color: var(--plum); }
.hero-letter span { color: var(--ink-soft); font-size: .6em; font-weight: 400; }

.herd { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 6px; max-width: 640px; }
.critter {
  border: 0; background: transparent; padding: 2px; line-height: 1; position: relative;
  font-size: var(--critter, 3rem); border-radius: 18px; transition: transform .15s;
}
.critter.counted { background: #fff4cc; }
.critter .tag {
  position: absolute; right: -2px; top: -4px; min-width: 1.4em; height: 1.4em; padding: 0 .2em;
  border-radius: 999px; background: var(--berry); color: #fff;
  font: 700 calc(var(--critter, 3rem) * .3) / 1.4em var(--font-letter);
  box-sizing: border-box;
}
.counter { font-family: var(--font-letter); font-weight: 700; font-size: 2.4rem; color: var(--berry); min-height: 1.2em; font-variant-numeric: tabular-nums; }

.sum { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.sum .group { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 42%; font-size: clamp(2rem, 9vw, 3.4rem); line-height: 1.1; }
.sum .op { font-family: var(--font-letter); font-weight: 700; font-size: 3rem; color: var(--grass-deep); }
.sum-words { font-family: var(--font-letter); font-weight: 700; font-size: clamp(2rem, 8vw, 3rem); color: var(--ink); }
.sum-words .q { color: var(--grass-deep); }

/* answers */
.answers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ans {
  min-height: 96px; border: 0; border-radius: 26px; background: var(--card);
  box-shadow: 0 6px 0 var(--sky-deep); display: grid; place-items: center;
  font-family: var(--font-letter); font-weight: 700; font-size: 3.2rem; color: var(--ink);
  transition: transform .12s, opacity .3s;
}
.ans.emoji { font-size: 3.6rem; font-family: var(--font-display); }
.ans .lc { font-weight: 400; color: var(--ink-soft); font-size: .7em; }
.ans:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sky-deep); }
.ans.wrong { opacity: .28; pointer-events: none; animation: wobble .4s; }
.ans.right { background: var(--ok); color: #fff; box-shadow: 0 6px 0 #2c7428; }
.ans.right .lc { color: #e6f5e4; }
.answers.wait .ans { pointer-events: none; }
.stage.locked { pointer-events: none; }

@keyframes wobble { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
@keyframes hop { 0% { transform: scale(1) } 40% { transform: scale(1.25) translateY(-8px) } 100% { transform: scale(1) } }
.hop { animation: hop .35s; }

/* celebration */
.burst { position: absolute; inset: 0; pointer-events: none; }
.burst i { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; border-radius: 4px; animation: fly .9s ease-out forwards; }
@keyframes fly { from { transform: translate(-50%,-50%) rotate(0) } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(400deg); opacity: 0 } }
.done-big { font-size: clamp(2.4rem, 9vw, 3.6rem); font-weight: 700; margin: 0; }
.done-stars { display: flex; gap: 8px; justify-content: center; }
.done-stars .star { width: 56px; height: 56px; }

@media (prefers-reduced-motion: reduce) {
  .hop, .ans.wrong, .burst i { animation: none !important; }
  .burst { display: none; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="bar" id="bar" hidden>
    <button class="icon-btn" id="homeBtn" aria-label="Back to games">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    </button>
    <button class="icon-btn" id="againBtn" aria-label="Hear it again">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/><path d="M19 6a8.5 8.5 0 010 12"/></svg>
    </button>
    <div class="stars" id="stars" aria-label="Stars this round"></div>
  </div>

  <!-- start -->
  <section class="screen" id="startScreen">
    <div class="hello">
      <div class="parade" aria-hidden="true">🐶🐄🦁🐸</div>
      <h1>Animal Sounds<br>&amp; Counting</h1>
      <button class="big-go" id="startBtn">Play!</button>
      <div class="loadnote" id="loadNote">Turn the sound up</div>
    </div>
  </section>

  <!-- menu -->
  <section class="screen" id="menuScreen" hidden>
    <div class="menu">
      <button class="game-card letters" data-game="letters"><span class="glyph">Bb</span>Letter sounds</button>
      <button class="game-card count" data-game="count"><span class="face">🐷🐷🐷</span>Counting</button>
      <button class="game-card add" data-game="add"><span class="glyph">2+1</span>Adding</button>
    </div>
    <div class="grownups">
      <span>Grown-ups: count up to</span>
      <div class="seg" role="group" aria-label="Highest number for counting">
        <button id="max10" aria-pressed="true">10</button>
        <button id="max25" aria-pressed="false">25</button>
      </div>
    </div>
  </section>

  <!-- play -->
  <section class="screen" id="playScreen" hidden>
    <div class="stage" id="stage"></div>
    <div class="answers" id="answers"></div>
  </section>
</div>

<script>
(() => {
  // ---------- data ----------
  const ANIMALS = [
    ['ant','🐜','A'],['bear','🐻','B'],['bee','🐝','B'],['cow','🐄','C'],['cat','🐱','C'],
    ['dog','🐶','D'],['duck','🦆','D'],['elephant','🐘','E'],['fish','🐟','F'],['fox','🦊','F'],
    ['frog','🐸','F'],['goat','🐐','G'],['horse','🐴','H'],['hippo','🦛','H'],['kangaroo','🦘','K'],
    ['lion','🦁','L'],['monkey','🐒','M'],['mouse','🐭','M'],['octopus','🐙','O'],['pig','🐷','P'],
    ['penguin','🐧','P'],['rabbit','🐰','R'],['snake','🐍','S'],['turtle','🐢','T'],['tiger','🐯','T'],
    ['whale','🐳','W'],['zebra','🦓','Z'],
  ].map(([name, emoji, letter]) => ({ name, emoji, letter }));
  const LETTERS = [...new Set(ANIMALS.map(a => a.letter))];
  const NUM_WORDS = ['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty','twenty-one','twenty-two','twenty-three','twenty-four','twenty-five'];
  // Spoken text, used only if a recorded clip fails to load.
  const TEXT = {
    welcome: "Hi friend! Let's play with the animals! Pick a game.",
    m_letters: 'Letter sounds!', m_count: 'Counting!', m_add: 'Adding!',
    count_q: 'How many animals? Tap each one to count!',
    count_pick: 'How many did you count? Tap the number.',
    add_q: 'How many altogether?', plus: 'plus',
    yes1: 'Great job!', yes2: 'You got it!', yes3: "Yes! That's right!", yes4: 'Way to go!',
    try1: 'Oops! Try again.', try2: 'Hmm, not quite. Try again!',
    together: "Let's count together!", done: 'You did it! You finished the game! High five!',
  };
  for (let i = 1; i <= 25; i++) TEXT['n' + i] = NUM_WORDS[i];
  for (const a of ANIMALS) {
    TEXT['q_' + a.name] = `${a.name}! What letter does ${a.name} start with?`;
    TEXT['a_' + a.name] = `${a.name} starts with ${a.letter}!`;
  }
  for (const L of LETTERS) TEXT['l_' + L] = `Which animal starts with ${L}?`;
  const ROUND = 5;

  // ---------- audio ----------
  let ctx = null;
  const buffers = {};
  const loading = {};
  let current = null;      // playing source
  let token = 0;           // bumps to cancel a running sequence

  function load(name) {
    if (!loading[name]) {
      loading[name] = fetch('audio/' + name + '.mp3')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(b => new Promise((res, rej) => ctx.decodeAudioData(b, res, rej)))
        .then(buf => (buffers[name] = buf))
        .catch(() => null);
    }
    return loading[name];
  }
  function stopAll() {
    token++;
    if (current) { try { current.stop(); } catch (e) {} current = null; }
    if (window.speechSynthesis) speechSynthesis.cancel();
  }
  // Phones can pause audio without warning (a call, the lock screen, iOS "interrupted"),
  // and then a clip never reports that it ended. Every clip gets a deadline so the game
  // never waits forever on sound.
  function playOne(name, my) {
    return Promise.race([load(name), wait(4000).then(() => null)]).then(buf => new Promise(res => {
      if (my !== token) return res();
      if (ctx && ctx.state !== 'running' && ctx.resume) ctx.resume().catch(() => {});
      let done = false;
      const finish = () => { if (!done) { done = true; res(); } };
      if (buf) {
        const src = ctx.createBufferSource();
        src.buffer = buf; src.connect(ctx.destination);
        src.onended = () => { if (current === src) current = null; finish(); };
        current = src; src.start();
        setTimeout(finish, buf.duration * 1000 + 800);
      } else if (window.speechSynthesis && TEXT[name]) {
        const u = new SpeechSynthesisUtterance(TEXT[name]);
        u.rate = 0.9; u.onend = finish; u.onerror = finish; speechSynthesis.speak(u);
        setTimeout(finish, 6000);
      } else finish();
    }));
  }
  async function say(...names) {
    stopAll();
    const my = token;
    for (const n of names) {
      if (my !== token) return false;
      await playOne(n, my);
      if (my !== token) return false;
      await wait(120);
    }
    return my === token;
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const praise = () => pick(['yes1', 'yes2', 'yes3', 'yes4']);
  const STAR = '<svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';

  let maxCount = 10;
  try { if (localStorage.getItem('maxCount') === '25') maxCount = 25; } catch (e) {}
  function setMax(n) {
    maxCount = n;
    $('max10').setAttribute('aria-pressed', n === 10);
    $('max25').setAttribute('aria-pressed', n === 25);
    try { localStorage.setItem('maxCount', String(n)); } catch (e) {}
  }
  setMax(maxCount);
  $('max10').onclick = () => setMax(10);
  $('max25').onclick = () => setMax(25);

  function show(id) {
    for (const s of ['startScreen', 'menuScreen', 'playScreen']) $(s).hidden = s !== id;
    $('bar').hidden = id === 'startScreen';
    $('againBtn').hidden = id !== 'playScreen';
    $('stars').hidden = id !== 'playScreen';
  }

  function burst() {
    const stage = $('stage');
    const b = document.createElement('div'); b.className = 'burst';
    const colors = ['#ffc93c', '#e8546b', '#7a5cc4', '#5fae4e', '#4fb3e8'];
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('i');
      const ang = (i / 18) * Math.PI * 2, dist = 120 + Math.random() * 90;
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      p.style.background = colors[i % colors.length];
      b.appendChild(p);
    }
    stage.appendChild(b);
    setTimeout(() => b.remove(), 1000);
  }

  // ---------- round state ----------
  let game = null, qIndex = 0, starsWon = 0, replay = () => {};
  let session = 0; // bumps when a game starts or the player goes home, so stale timers never move the game on

  function drawStars() {
    $('stars').innerHTML = Array.from({ length: ROUND }, (_, i) => STAR.replace('class="star"', `class="star${i < starsWon ? ' on' : ''}"`)).join('');
  }

  function startGame(g) {
    game = g; qIndex = 0; starsWon = 0;
    const my = ++session;
    replay = () => {};
    show('playScreen'); drawStars();
    say({ letters: 'm_letters', count: 'm_count', add: 'm_add' }[g]).then(() => { if (my === session) next(); });
  }

  function next() {
    $('stage').classList.remove('locked');
    if (qIndex >= ROUND) return finish();
    qIndex++;
    ({ letters: letterQ, count: countQ, add: addQ })[game]();
  }

  function finish() {
    replay = () => say('done');
    $('answers').innerHTML = '';
    $('stage').innerHTML = `<p class="done-big">You did it!</p><div class="done-stars">${STAR.replace('class="star"', 'class="star on"').repeat(ROUND)}</div><button class="big-go" id="againGame">Play again</button>`;
    $('againGame').onclick = () => startGame(game);
    burst(); setTimeout(burst, 350);
    say('done');
  }

  // Answer buttons. onRight returns the clips to play for a right answer.
  function answers(options, correct, render, onRight, onWrongTwice) {
    const box = $('answers');
    box.className = 'answers';
    box.innerHTML = '';
    let misses = 0, finished = false;
    for (const opt of options) {
      const b = document.createElement('button');
      b.className = 'ans' + (render.emoji ? ' emoji' : '');
      b.innerHTML = render(opt);
      b.setAttribute('aria-label', render.label ? render.label(opt) : String(opt));
      b.onclick = async () => {
        if (finished) return;
        if (opt === correct) {
          finished = true;
          b.classList.add('right'); box.classList.add('wait');
          $('stage').classList.add('locked');
          replay = () => {};
          starsWon++; drawStars(); burst();
          // Move on once the praise is done, even if a tap or a phone hiccup cut the sound short.
          const my = session;
          await say(...onRight());
          await wait(350);
          if (my === session) next();
        } else {
          misses++;
          b.classList.add('wrong');
          if (misses >= 2 && onWrongTwice) onWrongTwice();
          else say(misses === 1 ? 'try1' : 'try2');
        }
      };
      box.appendChild(b);
    }
  }

  // ---------- letters ----------
  let lastAnimal = null;
  function letterQ() {
    let a; do { a = pick(ANIMALS); } while (a === lastAnimal);
    lastAnimal = a;
    if (qIndex % 2 === 1) {
      // See the animal, pick its letter
      $('stage').innerHTML = `<div class="hero-animal hop">${a.emoji}</div><div class="hero-name"><b>${a.name[0]}</b>${a.name.slice(1)}</div>`;
      const opts = shuffle([a.letter, ...shuffle(LETTERS.filter(l => l !== a.letter)).slice(0, 2)]);
      const r = l => `<span>${l}<span class="lc">${l.toLowerCase()}</span></span>`;
      answers(opts, a.letter, r, () => ['a_' + a.name, praise()]);
      replay = () => say('q_' + a.name);
    } else {
      // See the letter, pick the animal
      $('stage').innerHTML = `<div class="hero-letter">${a.letter}<span>${a.letter.toLowerCase()}</span></div>`;
      const others = shuffle(ANIMALS.filter(x => x.letter !== a.letter));
      const opts = shuffle([a, others[0], others.find(x => x.letter !== others[0].letter)]);
      const r = x => x.emoji; r.emoji = true; r.label = x => x.name;
      answers(opts, a, r, () => {
        $('stage').innerHTML = `<div class="hero-animal hop">${a.emoji}</div><div class="hero-name"><b>${a.name[0]}</b>${a.name.slice(1)}</div>`;
        return ['a_' + a.name, praise()];
      });
      replay = () => say('l_' + a.letter);
    }
    replay();
  }

  // ---------- counting ----------
  function numberOptions(n, lo, hi) {
    const set = new Set([n]);
    const near = [n - 1, n + 1, n - 2, n + 2].filter(x => x >= lo && x <= hi);
    for (const x of shuffle(near)) { if (set.size < 3) set.add(x); }
    while (set.size < 3) set.add(rand(lo, hi));
    return shuffle([...set]);
  }
  const numRender = n => String(n);

  function countQ() {
    // Grow the numbers through the round so it starts easy.
    const lo = qIndex <= 2 ? 2 : Math.min(5, maxCount);
    const hi = qIndex <= 2 ? Math.min(6, maxCount) : maxCount;
    const n = rand(lo, hi);
    const a = pick(ANIMALS);
    const size = n <= 6 ? 4.4 : n <= 12 ? 3.4 : n <= 18 ? 2.7 : 2.3;
    const stage = $('stage');
    stage.innerHTML = `<div class="herd" id="herd" style="--critter:${size}rem"></div><div class="counter" id="counter" aria-live="polite"></div>`;
    const herd = $('herd');
    let counted = 0, autoCounting = false;
    for (let i = 0; i < n; i++) {
      const c = document.createElement('button');
      c.className = 'critter'; c.textContent = a.emoji; c.setAttribute('aria-label', a.name);
      c.onclick = () => tap(c);
      herd.appendChild(c);
    }
    function tap(c) {
      if (c.classList.contains('counted') || autoCounting) return;
      counted++;
      c.classList.add('counted', 'hop');
      c.insertAdjacentHTML('beforeend', `<span class="tag">${counted}</span>`);
      $('counter').textContent = counted;
      const all = counted === n;
      say('n' + counted, ...(all ? ['count_pick'] : []));
    }
    async function countTogether() {
      autoCounting = true;
      $('answers').classList.add('wait');
      try {
        if (!(await say('together'))) return;
        const crits = [...herd.children];
        crits.forEach(c => { c.classList.remove('counted', 'hop'); const t = c.querySelector('.tag'); if (t) t.remove(); });
        $('counter').textContent = '';
        const my = token;
        for (let i = 0; i < crits.length; i++) {
          if (my !== token) return;
          crits[i].classList.add('counted', 'hop');
          crits[i].insertAdjacentHTML('beforeend', `<span class="tag">${i + 1}</span>`);
          $('counter').textContent = i + 1;
          await playOne('n' + (i + 1), my);
          await wait(150);
        }
        counted = n;
      } finally {
        // Always hand control back, even if the counting was interrupted.
        autoCounting = false;
        $('answers').classList.remove('wait');
      }
    }
    answers(numberOptions(n, 1, Math.max(hi, 6)), n, numRender, () => ['n' + n, praise()], countTogether);
    replay = () => say('count_q');
    replay();
  }

  // ---------- adding ----------
  function addQ() {
    const total = rand(qIndex <= 2 ? 2 : 3, qIndex <= 2 ? 5 : 10);
    const x = rand(1, total - 1), y = total - x;
    const a = pick(ANIMALS);
    const group = k => `<div class="group" aria-label="${k} ${a.name}">${a.emoji.repeat(k)}</div>`;
    $('stage').innerHTML = `<div class="sum">${group(x)}<span class="op">+</span>${group(y)}</div><div class="sum-words">${x} + ${y} = <span class="q" id="sumAns">?</span></div>`;
    answers(numberOptions(total, 1, 12), total, numRender, () => {
      $('sumAns').textContent = total;
      return ['n' + total, praise()];
    }, () => {
      say('try2');
    });
    replay = () => say('n' + x, 'plus', 'n' + y, 'add_q');
    replay();
  }

  // ---------- wiring ----------
  $('startBtn').onclick = async () => {
    try {
      // Play through the phone's silent switch on iPhone/iPad (Safari 16.4+).
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
    } catch (e) {}
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    // A silent blip inside the tap unlocks audio on iOS.
    const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0);
    if (ctx.resume) ctx.resume();
    $('loadNote').textContent = 'Getting the animals ready…';
    await load('welcome');
    show('menuScreen');
    say('welcome');
    // Warm the rest in the background.
    Object.keys(TEXT).forEach((n, i) => setTimeout(() => load(n), 30 * i));
  };
  document.querySelectorAll('.game-card').forEach(b => b.onclick = () => startGame(b.dataset.game));
  $('homeBtn').onclick = () => { session++; stopAll(); show('menuScreen'); };
  // iOS can leave audio paused after an interruption; any tap wakes it back up.
  document.addEventListener('pointerdown', () => { if (ctx && ctx.state !== 'running' && ctx.resume) ctx.resume().catch(() => {}); });
  $('againBtn').onclick = () => replay();
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); else if (ctx && ctx.resume) ctx.resume(); });
})();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
